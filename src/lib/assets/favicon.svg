<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 24 24"
  fill="none"
>
  <defs>
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <ellipse cx="12" cy="12" rx="9" ry="11" stroke="url(#mirrorGrad)" stroke-width="2.5" fill="url(#glassGrad)" />

  <!-- Inner Bevel/Glass Edge -->
  <ellipse cx="12" cy="12" rx="7" ry="9" stroke="#bfdbfe" stroke-width="1.2" stroke-opacity="0.6" fill="none" />

  <!-- Primary Reflection Line -->
  <line x1="9" y1="14" x2="15" y2="8" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.9" stroke-linecap="round" />

  <!-- Secondary Reflection Line -->
  <line x1="8" y1="12" x2="11" y2="9" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />
</svg>